# Builds the public Kasm Minecraft image (no game files).
# Versions are pinned in the Dockerfile and bumped by Renovate (renovate.json):
# - Renovate branches / PRs: test build only, no push (the check automerge waits on)
# - push to main: build and push to GHCR
# - 1st of each month: rebuild for Ubuntu security updates
# Never build Dockerfile.baked here: a baked image contains Mojang's files.
name: Build image

on:
  push:
    branches: [main, "renovate/**"]
  pull_request:
  schedule:
    - cron: "0 9 1 * *"
  workflow_dispatch:

concurrency:
  group: build-${{ github.ref }}
  cancel-in-progress: true

env:
  IMAGE: ghcr.io/${{ github.repository }}
  KASM_TAG: "1.19.0"

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v7

      - name: Free disk space (image is ~4 GB)
        run: sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc /opt/hostedtoolcache/CodeQL

      - id: v
        run: |
          echo "prism=$(sed -n 's/^ARG PRISM_VERSION=//p' Dockerfile)" >> "$GITHUB_OUTPUT"
          echo "date=$(date -u +%Y%m%d)" >> "$GITHUB_OUTPUT"
          PUSH=false
          if [ "$GITHUB_REF" = refs/heads/main ] && [ "$GITHUB_EVENT_NAME" != pull_request ]; then PUSH=true; fi
          echo "push=$PUSH" >> "$GITHUB_OUTPUT"
          echo "### push=$PUSH ($GITHUB_EVENT_NAME on $GITHUB_REF_NAME)" >> "$GITHUB_STEP_SUMMARY"

      - uses: docker/setup-buildx-action@v3

      - uses: docker/login-action@v3
        if: steps.v.outputs.push == 'true'
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - uses: docker/build-push-action@v6
        with:
          context: .
          platforms: linux/amd64
          pull: true
          no-cache: ${{ github.event_name == 'schedule' }}
          push: ${{ steps.v.outputs.push == 'true' }}
          provenance: false
          tags: |
            ${{ env.IMAGE }}:${{ env.KASM_TAG }}
            ${{ env.IMAGE }}:${{ env.KASM_TAG }}-${{ steps.v.outputs.date }}
            ${{ env.IMAGE }}:latest
          labels: |
            org.opencontainers.image.source=${{ github.server_url }}/${{ github.repository }}
            org.opencontainers.image.description=Kasm workspace: Minecraft Java via Prism Launcher ${{ steps.v.outputs.prism }} (no game files)
