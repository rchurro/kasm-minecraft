# Builds the public Kasm Minecraft workspace image (no game files) and pushes it to GHCR.
# Never build BAKE=true here: a baked image contains Mojang's files and must stay private.
name: Build image

on:
  push:
    branches: [main]
  schedule:
    - cron: "0 9 * * 1" # Mondays 09:00 UTC: new Prism/VirtualGL releases + base patches
  workflow_dispatch:

concurrency:
  group: build
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    env:
      IMAGE: ghcr.io/${{ github.repository }}
      KASM_TAG: "1.19.0"
    steps:
      - uses: actions/checkout@v4

      - name: Free disk space (image is ~4.7 GB)
        run: sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc /opt/hostedtoolcache/CodeQL

      - name: Resolve upstream versions
        id: v
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh_latest() { curl -fsSL -H "Authorization: Bearer $GH_TOKEN" "https://api.github.com/repos/$1/releases/latest" | jq -r .tag_name; }
          PRISM=$(gh_latest PrismLauncher/PrismLauncher)
          VGL=$(gh_latest VirtualGL/virtualgl)
          for x in "$PRISM" "$VGL"; do [ -n "$x" ] && [ "$x" != null ] || { echo "version lookup failed"; exit 1; }; done
          echo "prism=$PRISM" >> "$GITHUB_OUTPUT"; echo "vgl=$VGL" >> "$GITHUB_OUTPUT"
          echo "date=$(date -u +%Y%m%d)" >> "$GITHUB_OUTPUT"
          echo "### Prism $PRISM · VirtualGL $VGL" >> "$GITHUB_STEP_SUMMARY"

      - uses: docker/setup-buildx-action@v3

      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - uses: docker/build-push-action@v6
        with:
          context: .
          platforms: linux/amd64
          pull: true
          no-cache: ${{ github.event_name == 'schedule' }}
          push: true
          build-args: |
            BAKE=false
            PRISM_VERSION=${{ steps.v.outputs.prism }}
            VGL_VERSION=${{ steps.v.outputs.vgl }}
          tags: |
            ${{ env.IMAGE }}:${{ env.KASM_TAG }}
            ${{ env.IMAGE }}:${{ env.KASM_TAG }}-${{ steps.v.outputs.date }}
            ${{ env.IMAGE }}:latest
          labels: |
            org.opencontainers.image.source=${{ github.server_url }}/${{ github.repository }}
            org.opencontainers.image.description=Kasm workspace: Minecraft Java via Prism Launcher ${{ steps.v.outputs.prism }} (no game files)
